# tmux theme: remote — cyan accents
set -g status-left "#[bg=#7dcfff,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7dcfff]"
set -g status-right "#[fg=#2d5a6e]#[bg=#2d5a6e,fg=#c0caf5] %H:%M #[bg=#7dcfff,fg=#1a1b26,bold] #h "
set -g pane-active-border-style "fg=#7dcfff"
set -g message-style "bg=#1a1b26,fg=#7dcfff"
set -g clock-mode-colour "#7dcfff"
