# tmux theme: prod — red accents, high signal
set -g status-left "#[bg=#f7768e,fg=#1a1b26,bold] PROD: #S #[bg=#1a1b26,fg=#f7768e]"
set -g status-right "#[fg=#703040]#[bg=#703040,fg=#c0caf5] %H:%M #[bg=#f7768e,fg=#1a1b26,bold] #h "
set -g pane-active-border-style "fg=#f7768e"
set -g message-style "bg=#1a1b26,fg=#f7768e"
set -g clock-mode-colour "#f7768e"
